version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:15"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    groups:
      nonbreaking-npm-updates:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:35"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 2
