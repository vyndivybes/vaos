name: automation-fabric-qualification

on:
  push:
    branches:
      - prep/automation-integration-fabric
    paths:
      - ".github/automation-fabric-qualification.trigger"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  definitive-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Full VAOS qualification
        run: npm test

      - name: Cloudflare Worker dry-run
        run: npx --yes wrangler@4.136.3 deploy --dry-run --config wrangler.jsonc --outdir .wrangler-dry-run
