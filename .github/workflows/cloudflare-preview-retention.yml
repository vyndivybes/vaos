name: VAOS Cloudflare Preview Retention

on:
  pull_request:
    paths:
      - 'scripts/cloudflare/preview-cleanup.mjs'
      - 'scripts/cloudflare/preview-cleanup.test.mjs'
      - '.github/workflows/cloudflare-preview-retention.yml'
  schedule:
    - cron: '19 */6 * * *'
  workflow_dispatch:
    inputs:
      apply:
        type: boolean
        description: 'Apply verified cleanup (default is dry-run)'
        required: false
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: vaos-cloudflare-preview-retention
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/cloudflare/preview-cleanup.mjs
      - run: node --test scripts/cloudflare/preview-cleanup.test.mjs

  cleanup:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e20ce7032f6475caaf1197b09d3fe164
      CLEANUP_APPLY: ${{ github.event_name == 'schedule' || inputs.apply == true }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retire only merged, aged, empty-state VAOS previews
        run: node scripts/cloudflare/preview-cleanup.mjs
