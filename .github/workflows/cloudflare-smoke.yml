name: cloudflare-smoke

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "platform/**"
      - "packages/**"
      - "wrangler.jsonc"
      - "package.json"
      - ".github/workflows/cloudflare-smoke.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "platform/**"
      - "packages/**"
      - "wrangler.jsonc"
      - ".github/workflows/cloudflare-smoke.yml"

permissions:
  contents: read

jobs:
  worker-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test Cloudflare compatibility adapter
        run: node --test apps/web/cloudflare-worker.test.mjs apps/web/lib/cloudflare-adapter.test.mjs apps/web/api/zapier-webhook.test.mjs

      - name: Syntax-check Cloudflare entrypoints
        run: node --check apps/web/cloudflare-worker.mjs && node --check apps/web/lib/cloudflare-adapter.mjs && node --check apps/web/api/zapier-webhook.mjs

      - name: Bundle Cloudflare Worker without deploying
        run: npx --yes wrangler@4.136.3 deploy --dry-run --config wrangler.jsonc --outdir .wrangler-dry-run
