name: Dify qualification gates
on:
  pull_request:
    paths:
      - 'integrations/dify/**'
      - 'apps/web/api/dify-live-reconciliation*'
      - 'apps/web/api/dify-exact-verification*'
      - 'apps/web/api/dify-live-qualification*'
      - 'apps/web/cloudflare-worker.mjs'
      - '.github/workflows/dify-qualification.yml'
  workflow_dispatch:
jobs:
  qualification-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify syntax
        run: |
          node --check integrations/dify/qualification-client.mjs
          node --check integrations/dify/github-evidence-verifier.mjs
          node --check apps/web/api/dify-live-qualification.mjs
          node --check apps/web/api/dify-live-reconciliation.mjs
          node --check integrations/dify/run-history.mjs
          node --check integrations/dify/exact-run-verifier.mjs
          node --check apps/web/api/dify-exact-verification.mjs
      - name: Run Dify and independent evidence tests
        run: node --test integrations/dify/*.test.mjs apps/web/api/dify-live-qualification.test.mjs apps/web/api/dify-live-reconciliation.test.mjs apps/web/api/dify-exact-verification.test.mjs
      - name: Live independent GitHub evidence readback
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node integrations/dify/live-github-readback.mjs
