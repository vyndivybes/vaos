name: infisical-scoped-commissioning

on:
  schedule:
    # Every 15 minutes at off-peak UTC minutes to avoid crowded quarter-hours.
    # GitHub schedules are best-effort; independent missed-run checks remain required.
    - cron: '7,22,37,52 * * * *'
  # A single trusted main-branch push can bootstrap and verify the live canary.
  push:
    branches:
      - main
    paths:
      - .github/infisical-watchdog-bootstrap.trigger
  workflow_dispatch:
    inputs:
      action:
        description: "Record health after live checks, or emergency disable"
        type: choice
        required: true
        options: [record-health, disable]
      watchdog_tick:
        description: 'Optional Cloudflare cron tick in epoch milliseconds'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: infisical-scoped-commissioning
  cancel-in-progress: false

jobs:
  production-watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: infisical-commissioning
    env:
      WATCHDOG_TICK: ${{ inputs.watchdog_tick }}
      VAOS_INFISICAL_WATCHDOG_KEY: ${{ secrets.VAOS_INFISICAL_COMMISSIONING_KEY }}
      REQUESTED_ACTION: ${{ (github.event_name == 'schedule' || github.event_name == 'push') && 'record-health' || inputs.action }}
      INFISICAL_BASE_URL: ${{ vars.INFISICAL_BASE_URL }}
      INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
      INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
      INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
      INFISICAL_DENIED_PROJECT_ID: ${{ vars.INFISICAL_DENIED_PROJECT_ID }}
      INFISICAL_ENVIRONMENT: ${{ vars.INFISICAL_ENVIRONMENT }}
      INFISICAL_ALLOWED_SECRET_PATH: ${{ vars.INFISICAL_ALLOWED_SECRET_PATH }}
      INFISICAL_ALLOWED_SECRET_KEY: ${{ vars.INFISICAL_ALLOWED_SECRET_KEY }}
      INFISICAL_DENIED_SECRET_PATH: ${{ vars.INFISICAL_DENIED_SECRET_PATH }}
      INFISICAL_DENIED_SECRET_KEY: ${{ vars.INFISICAL_DENIED_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Record fixed-format Cloudflare dispatch correlation
        if: ${{ inputs.watchdog_tick != '' }}
        run: >-
          node --input-type=module -e
          "const t=process.env.WATCHDOG_TICK;if(!/^[0-9]{13}$/.test(t||''))process.exit(1);console.log('VAOS_INFISICAL_WATCHDOG_TICK='+t);"
      - name: Preflight durable watchdog identity
        run: test -n "${VAOS_INFISICAL_WATCHDOG_KEY:-}"
      - name: Live authentication, canary, TTL and kill-switch checks
        id: live
        if: ${{ env.REQUESTED_ACTION == 'record-health' }}
        continue-on-error: true
        run: node scripts/qualification/infisical-wave2-live.mjs
      - name: Persist healthy status without changing routing
        if: ${{ env.REQUESTED_ACTION == 'record-health' && steps.live.outcome == 'success' }}
        env:
          INFISICAL_COMMISSION_ACTION: record-health
        run: node scripts/qualification/record-infisical-commissioning.mjs
      - name: Fail closed after scheduled live-check failure
        if: ${{ (github.event_name == 'schedule' || github.event_name == 'push' || inputs.watchdog_tick != '') && steps.live.outcome == 'failure' }}
        env:
          INFISICAL_COMMISSION_ACTION: disable
          INFISICAL_DISABLE_CONFIRM: DISABLE-ONLY
        run: node scripts/qualification/record-infisical-commissioning.mjs
      - name: Manual emergency disable
        if: ${{ github.event_name == 'workflow_dispatch' && env.REQUESTED_ACTION == 'disable' }}
        env:
          INFISICAL_COMMISSION_ACTION: disable
          INFISICAL_DISABLE_CONFIRM: DISABLE-ONLY
        run: node scripts/qualification/record-infisical-commissioning.mjs
      - name: Fail manual health request when live checks fail
        if: ${{ github.event_name == 'workflow_dispatch' && env.REQUESTED_ACTION == 'record-health' && steps.live.outcome == 'failure' }}
        run: exit 1
      - uses: actions/upload-artifact@v5
        if: ${{ env.REQUESTED_ACTION == 'record-health' && steps.live.outcome == 'success' }}
        with:
          name: infisical-watchdog-evidence
          path: qualification-evidence/provider-wave-2/infisical.json
          retention-days: 30
