      - '.github/workflows/jarvis-controlled-release.yml'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Reviewed exact main commit to release
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: vaos-controlled-worker-deploy
  cancel-in-progress: false
jobs:
  # Runs repository code (tests, dependency install) with NO secrets in scope.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Require exact reviewed main
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate exact-locked Wrangler release contract
        run: node --test scripts/cloudflare/release-source-pin.test.mjs
      - name: Full regression before release
        run: npm test

  # The only job that can reach Cloudflare. The `production-deploy` environment must
  # have required reviewers and be restricted to the main branch (repo Settings ->
  # Environments); CLOUDFLARE_API_TOKEN belongs in that
  # environment's secrets, not repository secrets.
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-deploy
    env:
      CLOUDFLARE_ACCOUNT_ID: e20ce7032f6475caaf1197b09d3fe164
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Require exact reviewed main and existing credential
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -n "$CLOUDFLARE_API_TOKEN"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Recheck main before deployment
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_SHA"
      - name: Deploy existing Worker with governance controls retained
        run: npx --no-install wrangler deploy --config wrangler.jsonc
