name: JARVIS Market Intelligence V1 qualification
on:
  pull_request:
    branches: [main]
    paths:
      - 'intelligence/market-case-study*.mjs'
      - 'intelligence/market-continuity*.mjs'
      - 'intelligence/market-public-sources*.mjs'
      - 'intelligence/market-series-forecast*.mjs'
      - 'intelligence/market-monitoring*.mjs'
      - 'apps/web/api/market-public-intelligence*.mjs'
      - 'apps/web/market-public-intelligence*.mjs'
      - 'wrangler.jsonc'
      - 'apps/web/api/market-case-studies*.mjs'
      - 'apps/web/market-intelligence.*'
      - 'apps/web/market-human-language.test.mjs'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'docs/WRITING_FOR_PEOPLE.md'
      - 'docs/JARVIS_MARKET_INTELLIGENCE_V1.md'
      - 'apps/web/cloudflare-worker.mjs'
      - 'knowledge/business-cases/BUSINESS-CASE-003.md'
      - '.github/workflows/jarvis-market-intelligence.yml'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  evidence-bound-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm free hosted runner runtime (no dependency installs)
        run: node --version
      - name: Validate market intelligence syntax
        run: |
          node --check intelligence/market-continuity.mjs
          node --check intelligence/market-public-sources.mjs
          node --check intelligence/market-series-forecast.mjs
          node --check intelligence/market-monitoring.mjs
          node --check apps/web/api/market-public-intelligence.mjs
          node --check apps/web/market-public-intelligence.mjs
          node --check intelligence/market-case-study.mjs
          node --check apps/web/api/market-case-studies.mjs
          node --check apps/web/market-intelligence.mjs
          node --check apps/web/cloudflare-worker.mjs
      - name: Test analytical accuracy, provenance, access controls, archive and RSS
        run: node --test apps/web/market-human-language.test.mjs intelligence/market-public-sources.test.mjs intelligence/market-series-forecast.test.mjs intelligence/market-monitoring.test.mjs apps/web/api/market-public-intelligence.test.mjs apps/web/market-public-intelligence-ui.test.mjs intelligence/market-continuity.test.mjs intelligence/market-case-study.test.mjs apps/web/api/market-case-studies.test.mjs apps/web/market-intelligence.test.mjs
