name: provider-wave2-infisical-live-qualification

on:
  workflow_dispatch:
  push:
    branches:
      - qualify/infisical-live
    paths:
      - .github/provider-wave2-infisical-live.trigger

permissions:
  contents: read

concurrency:
  group: provider-wave2-infisical-live-qualification
  cancel-in-progress: true

jobs:
  live-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      INFISICAL_BASE_URL: ${{ vars.INFISICAL_BASE_URL }}
      INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
      INFISICAL_DENIED_PROJECT_ID: ${{ vars.INFISICAL_DENIED_PROJECT_ID }}
      INFISICAL_ENVIRONMENT: ${{ vars.INFISICAL_ENVIRONMENT }}
      INFISICAL_ALLOWED_SECRET_PATH: ${{ vars.INFISICAL_ALLOWED_SECRET_PATH }}
      INFISICAL_ALLOWED_SECRET_KEY: ${{ vars.INFISICAL_ALLOWED_SECRET_KEY }}
      INFISICAL_DENIED_SECRET_PATH: ${{ vars.INFISICAL_DENIED_SECRET_PATH }}
      INFISICAL_DENIED_SECRET_KEY: ${{ vars.INFISICAL_DENIED_SECRET_KEY }}
      INFISICAL_MIN_TOKEN_TTL_SECONDS: ${{ vars.INFISICAL_MIN_TOKEN_TTL_SECONDS }}
      INFISICAL_MAX_TOKEN_TTL_SECONDS: ${{ vars.INFISICAL_MAX_TOKEN_TTL_SECONDS }}
      INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
      INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Contract qualification checks
        run: >-
          node --test
          platform/execution/provider-qualification-engine.test.mjs
          platform/qualification/provider-live-evidence.test.mjs
          platform/qualification/provider-wave-2-profiles.test.mjs
          integrations/infisical/secret-resolver.test.mjs
          integrations/infisical/api-transport.test.mjs
          integrations/infisical/qualification-runner.test.mjs
          integrations/infisical/staging-qualification-runner.test.mjs

      - name: Qualification configuration preflight
        shell: bash
        run: |
          set -euo pipefail
          required=(
            INFISICAL_PROJECT_ID
            INFISICAL_ENVIRONMENT
            INFISICAL_ALLOWED_SECRET_PATH
            INFISICAL_ALLOWED_SECRET_KEY
            INFISICAL_DENIED_SECRET_PATH
            INFISICAL_DENIED_SECRET_KEY
            INFISICAL_CLIENT_ID
            INFISICAL_CLIENT_SECRET
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required Wave 2 configuration: $name"
              exit 1
            fi
          done

      - name: Infisical ephemeral-live qualification
        run: node scripts/qualification/infisical-wave2-live.mjs

      - uses: actions/upload-artifact@v5
        with:
          name: provider-wave2-infisical-live-evidence
          path: qualification-evidence/provider-wave-2/infisical.json
          retention-days: 30
