name: provider-wave2-infisical-production-qualification

on:
  workflow_dispatch:
  push:
    branches:
      - qualify/infisical-live
    paths:
      - .github/provider-wave2-infisical-production.trigger

permissions:
  contents: read

concurrency:
  group: provider-wave2-infisical-production-qualification
  cancel-in-progress: true

jobs:
  production-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      INFISICAL_BASE_URL: ${{ vars.INFISICAL_BASE_URL }}
      INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
      INFISICAL_ENVIRONMENT: ${{ vars.INFISICAL_ENVIRONMENT }}
      INFISICAL_ALLOWED_SECRET_PATH: ${{ vars.INFISICAL_ALLOWED_SECRET_PATH }}
      INFISICAL_ALLOWED_SECRET_KEY: ${{ vars.INFISICAL_ALLOWED_SECRET_KEY }}
      INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_NEXT_CLIENT_ID }}
      INFISICAL_REVOKED_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
      # The old credential stays in INFISICAL_CLIENT_SECRET until promotion.
      # The new credential is preflighted separately and stored in NEXT.
      INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_NEXT_CLIENT_SECRET }}
      INFISICAL_REVOKED_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Production qualification contract checks
        run: >-
          node --test
          platform/execution/provider-qualification-engine.test.mjs
          platform/qualification/provider-live-evidence.test.mjs
          platform/qualification/provider-wave-2-profiles.test.mjs
          integrations/infisical/api-transport.test.mjs
          integrations/infisical/production-qualification-runner.test.mjs

      - name: Production qualification configuration preflight
        shell: bash
        run: |
          set -euo pipefail
          required=(
            INFISICAL_PROJECT_ID
            INFISICAL_ENVIRONMENT
            INFISICAL_ALLOWED_SECRET_PATH
            INFISICAL_ALLOWED_SECRET_KEY
            INFISICAL_CLIENT_ID
            INFISICAL_REVOKED_CLIENT_ID
            INFISICAL_CLIENT_SECRET
            INFISICAL_REVOKED_CLIENT_SECRET
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required Wave 2 production configuration: $name"
              exit 1
            fi
          done

      - name: Infisical rotation and rollback qualification
        run: node scripts/qualification/infisical-wave2-production.mjs

      - uses: actions/upload-artifact@v5
        with:
          name: provider-wave2-infisical-production-evidence
          path: qualification-evidence/provider-wave-2/infisical-production.json
          retention-days: 30
