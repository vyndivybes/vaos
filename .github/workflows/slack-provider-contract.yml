name: slack-provider-contract
on:
  pull_request:
    paths:
      - 'integrations/slack/**'
      - '.github/workflows/slack-provider-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test integrations/slack/notification-adapter.test.mjs apps/web/api/slack-qualification.test.mjs
      - run: node --check integrations/slack/notification-adapter.mjs && node --check apps/web/api/slack-qualification.mjs
