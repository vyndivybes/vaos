name: stage8-auto-independent-qualification
on:
  workflow_run:
    workflows: [stage8-hosted-actual-auth]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Successful hosted qualification run ID'
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  independently-certify:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment: stage8-isolated-qualification
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate signed Stage 8 authentication evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STAGE8_SOURCE_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || github.event.workflow_run.id }}
          VAOS_STAGE8_EVIDENCE_SIGNING_KEY: ${{ secrets.VAOS_STAGE8_EVIDENCE_SIGNING_KEY }}
        run: node scripts/qualification/stage8-independent-signer.mjs
      - name: Validate isolated rollback and sign time-limited founder-approved cutover
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STAGE8_SOURCE_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || github.event.workflow_run.id }}
          STAGE8_FOUNDER_AUTHORIZED: approved
          VAOS_STAGE8_CUTOVER_APPROVAL_SIGNING_KEY: ${{ secrets.VAOS_STAGE8_CUTOVER_APPROVAL_SIGNING_KEY }}
        run: node scripts/qualification/stage8-cutover-signer.mjs
      - name: Preserve independently verified certificates
        uses: actions/upload-artifact@v4
        with:
          name: stage8-qualified-cutover-certificates
          path: |
            stage8-signed-qualification.json
            stage8-signed-cutover.json
          retention-days: 1
          if-no-files-found: error

      - name: Validate scoped certificate installation package
        env:
          VAOS_STAGE8_EVIDENCE_SIGNING_KEY: ${{ secrets.VAOS_STAGE8_EVIDENCE_SIGNING_KEY }}
          VAOS_STAGE8_CUTOVER_APPROVAL_SIGNING_KEY: ${{ secrets.VAOS_STAGE8_CUTOVER_APPROVAL_SIGNING_KEY }}
          STAGE8_BULK_SECRET_FILE: ${{ runner.temp }}/stage8-certificate-secrets.json
        run: node scripts/qualification/stage8-certificate-bulk-package.mjs
      - name: Install certificates only when production gate is explicitly enabled
        if: ${{ vars.STAGE8_CERT_INSTALL_ENABLED == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGE8_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGE8_BULK_SECRET_FILE: ${{ runner.temp }}/stage8-certificate-secrets.json
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -s "$STAGE8_BULK_SECRET_FILE"
          npx --yes wrangler@4 secret bulk "$STAGE8_BULK_SECRET_FILE" --name vaos
      - name: Destroy local certificate installation package
        if: always()
        env:
          STAGE8_BULK_SECRET_FILE: ${{ runner.temp }}/stage8-certificate-secrets.json
        run: rm -f "$STAGE8_BULK_SECRET_FILE"
