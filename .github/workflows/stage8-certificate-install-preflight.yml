name: stage8-certificate-install-preflight
on:
  pull_request:
    paths:
      - 'scripts/qualification/stage8-certificate-install-preflight.mjs'
      - 'scripts/qualification/stage8-certificate-install-preflight.test.mjs'
      - '.github/workflows/stage8-certificate-install-preflight.yml'
      - 'scripts/qualification/stage8-certificate-bulk-package.mjs'
      - 'scripts/qualification/stage8-certificate-bulk-package.test.mjs'
      - '.github/workflows/stage8-auto-independent-qualification.yml'
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/qualification/stage8-certificate-install-preflight.test.mjs
      - run: node --test scripts/qualification/stage8-certificate-bulk-package.test.mjs
      - run: node --check scripts/qualification/stage8-certificate-install-preflight.mjs
      - run: node --check scripts/qualification/stage8-certificate-bulk-package.mjs
