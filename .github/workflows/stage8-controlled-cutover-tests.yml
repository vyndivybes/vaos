name: stage8-controlled-cutover-tests
on:
  pull_request:
    paths:
      - 'apps/web/lib/stage8-cutover-approval.mjs'
      - 'apps/web/lib/stage8-cutover-approval.test.mjs'
      - 'apps/web/api/auth-cutover-readiness.mjs'
      - '.github/workflows/stage8-controlled-cutover-tests.yml'
permissions:
  contents: read
jobs:
  cutover-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test apps/web/lib/stage8-cutover-approval.test.mjs apps/web/api/auth-cutover-readiness.test.mjs
