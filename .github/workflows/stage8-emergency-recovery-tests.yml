name: stage8-emergency-recovery-tests
on:
  pull_request:
    paths:
      - 'scripts/qualification/stage8-hosted-real-auth.mjs'
      - 'scripts/qualification/stage8-hosted-auth-fixture.mjs'
      - 'scripts/qualification/stage8-emergency-recovery-gate.test.mjs'
      - '.github/workflows/stage8-emergency-recovery-tests.yml'
permissions:
  contents: read
jobs:
  emergency-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/qualification/stage8-emergency-recovery-gate.test.mjs
      - run: node --check scripts/qualification/stage8-hosted-real-auth.mjs
