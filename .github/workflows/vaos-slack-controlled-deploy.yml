# One-time post-publish Zapier Catch Hook end-to-end canary deployment (12 Oct 2026)
name: vaos-slack-controlled-deploy
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vaos-slack-controlled-deploy.yml'
permissions:
  contents: read
concurrency:
  group: vaos-controlled-worker-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: e20ce7032f6475caaf1197b09d3fe164
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fail closed if deploy credential is not stored in GitHub Actions
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::HOLD: CLOUDFLARE_API_TOKEN is not configured as a GitHub Actions secret."
            exit 1
          fi
      - name: Install pinned repository dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify secured Slack ingress and Worker compatibility
        run: node --test apps/web/api/slack-events.test.mjs apps/web/cloudflare-worker.test.mjs platform/execution/slack-founder-agent.test.mjs platform/execution/github-slack-ci.test.mjs platform/execution/slack-incident-observer.test.mjs apps/web/api/google-workspace.test.mjs platform/execution/google-founder-daily-brief.test.mjs platform/execution/zapier-evidence.test.mjs platform/execution/zapier-slack-one-shot.test.mjs
      - name: Deploy code with existing variables and secrets preserved
        run: npx --yes wrangler@4.136.3 deploy --config wrangler.jsonc
