# Controlled VAOS Worker deployment for encrypted Slack signing-secret migration (12 Oct 2026)
# Safe transition: do not remove the legacy binding until the encrypted replacement is installed and verified.
name: vaos-slack-controlled-deploy
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vaos-slack-controlled-deploy.yml'
      - 'apps/web/lib/feature-flags.mjs'
      - 'apps/web/api/federated-knowledge.mjs'
      - 'apps/web/api/langgraph.mjs'
      - 'apps/web/api/google-workspace.mjs'
      - 'apps/web/lib/founder-google-intents.mjs'
      - 'apps/web/main-voice.mjs'
      - 'apps/web/workspace.mjs'
      - 'apps/web/lib/voice-acknowledgement.mjs'
      - 'apps/web/lib/voice-acknowledgement.test.mjs'
      - 'apps/web/lib/founder-voice-identity.mjs'
      - 'apps/web/workspace.html'
      - 'platform/execution/slack-founder-agent.mjs'
      - 'platform/execution/slack-founder-operations.mjs'
      - 'platform/execution/founder-business-brief.mjs'
      - 'apps/web/api/slack-events.mjs'
      - 'apps/web/jarvis-multimodal.html'
      - 'apps/web/jarvis-multimodal.mjs'
      - 'apps/web/api/jarvis-multimodal.mjs'
      - 'apps/web/api/jarvis-multimodal.test.mjs'
      - 'apps/web/lib/video-sense.mjs'
      - 'apps/web/.assetsignore'
      - 'apps/web/browser-asset-closure.test.mjs'
      - 'apps/web/lib/live-sense.mjs'
      - 'apps/web/lib/live-sense.test.mjs'
      - 'apps/web/lib/guided-visual-conversation.mjs'
      - 'apps/web/lib/visual-session-context.mjs'
      - 'apps/web/lib/project-notes.mjs'
      - 'apps/web/lib/project-notes.test.mjs'
      - 'apps/web/lib/visual-session-context.test.mjs'
      - 'apps/web/lib/guided-visual-conversation.test.mjs'
      - 'apps/web/lib/voice-readback.mjs'
      - 'apps/web/cloudflare-worker.mjs'
      - 'wrangler.jsonc'
permissions:
  contents: read
concurrency:
  group: vaos-controlled-worker-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: e20ce7032f6475caaf1197b09d3fe164
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fail closed if deploy credential is not stored in GitHub Actions
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::HOLD: CLOUDFLARE_API_TOKEN is not configured as a GitHub Actions secret."
            exit 1
          fi
      - name: Install pinned repository dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify secured Slack ingress and Worker compatibility
        run: node --test apps/web/lib/feature-flags.test.mjs apps/web/api/slack-events.test.mjs apps/web/cloudflare-worker.test.mjs platform/execution/slack-founder-agent.test.mjs platform/execution/slack-founder-operations.test.mjs platform/execution/slack-department-brief.test.mjs platform/execution/github-slack-ci.test.mjs platform/execution/slack-incident-observer.test.mjs apps/web/api/google-workspace.test.mjs apps/web/lib/founder-google-intents.test.mjs apps/web/main-voice.test.mjs apps/web/lib/voice-acknowledgement.test.mjs apps/web/voice-interaction.test.mjs platform/execution/google-founder-daily-brief.test.mjs platform/execution/zapier-evidence.test.mjs platform/execution/zapier-slack-one-shot.test.mjs
      - name: Check founder video-sense and evidence contracts before deployment
        run: node --test apps/web/lib/project-notes.test.mjs apps/web/lib/visual-session-context.test.mjs apps/web/browser-asset-closure.test.mjs apps/web/api/jarvis-multimodal.test.mjs apps/web/lib/live-sense.test.mjs apps/web/lib/guided-visual-conversation.test.mjs
      - name: Deploy code with existing variables and secrets preserved
        run: npx --yes wrangler@4.136.3 deploy --config wrangler.jsonc
