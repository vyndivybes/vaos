name: web-smoke

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  login-surface:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify login surface
        run: npm test

      - name: Verify Slack adapter and Worker runtime contract
        run: node --test integrations/slack/notification-adapter.test.mjs apps/web/api/slack-qualification.test.mjs
