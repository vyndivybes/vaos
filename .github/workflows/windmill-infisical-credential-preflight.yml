name: windmill-infisical-credential-preflight

on:
  pull_request:
    paths:
      - '.github/workflows/windmill-infisical-credential-preflight.yml'
      - 'integrations/windmill/credential-preflight.mjs'
      - 'integrations/windmill/credential-preflight.test.mjs'
      - 'scripts/qualification/windmill-infisical-credential-preflight.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windmill-infisical-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Run offline security tests
        run: node --test integrations/windmill/credential-preflight.test.mjs
      - name: Syntax check the credential preflight
        run: node --check scripts/qualification/windmill-infisical-credential-preflight.mjs

  credential-read-only:
    # Never expose production secrets to PR code or non-main refs.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: contract-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      INFISICAL_BASE_URL: ${{ vars.INFISICAL_BASE_URL }}
      INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
      WINDMILL_INFISICAL_PROJECT_ID: ${{ vars.WINDMILL_INFISICAL_PROJECT_ID }}
      WINDMILL_INFISICAL_CLIENT_ID: ${{ secrets.WINDMILL_INFISICAL_CLIENT_ID }}
      WINDMILL_INFISICAL_CLIENT_SECRET: ${{ secrets.WINDMILL_INFISICAL_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check that configuration is present (names only)
        shell: bash
        run: |
          set -euo pipefail
          for name in INFISICAL_PROJECT_ID WINDMILL_INFISICAL_PROJECT_ID WINDMILL_INFISICAL_CLIENT_ID WINDMILL_INFISICAL_CLIENT_SECRET; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required configuration: $name"
              exit 1
            fi
          done
      - name: Read-only production secret and qualification isolation probe
        run: node scripts/qualification/windmill-infisical-credential-preflight.mjs
      - name: Upload sanitized qualification evidence
        uses: actions/upload-artifact@v5
        with:
          name: windmill-infisical-credential-preflight-evidence
          path: qualification-evidence/windmill-infisical/credential-preflight.json
          retention-days: 30
