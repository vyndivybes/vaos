name: Workforce 16-identity prelaunch policy qualification
on:
  pull_request:
    branches: [main]
    paths:
      - 'platform/qualification/workforce-prelaunch-drills.test.mjs'
      - 'platform/runtime/policy-engine.mjs'
      - 'agents/workforce/**'
      - 'platform/qualification/workforce-exercise-cases.mjs'
      - 'apps/web/api/workforce-exercise*'
      - 'platform/execution/mission-step*'
      - 'platform/execution/mission-consumer*'
      - 'apps/web/lib/founder-mission*'
      - '.github/workflows/workforce-prelaunch-qualification.yml'
permissions:
  contents: read
jobs:
  role-isolation-and-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify all sixteen agents in isolated dry-run, no live actuation
        run: node --test platform/qualification/workforce-prelaunch-drills.test.mjs agents/workforce/prepare-executor.test.mjs apps/web/api/workforce-exercise.test.mjs platform/execution/mission-step.test.mjs apps/web/lib/founder-mission-flow.test.mjs apps/web/lib/founder-mission-results.test.mjs apps/web/api/missions.test.mjs

