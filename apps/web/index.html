<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#171b18" />
  <meta name="description" content="Sign in to the VAOS Agentic AI Autonomous Ecosystem by Vāyū Shastr Pvt. Ltd." />
  <title>Sign in · VAOS Agentic AI Autonomous Ecosystem</title>
  <link rel="icon" type="image/webp" href="/assets/vayu-shastr-original.webp" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/login-cinematic.css" />
  <link rel="stylesheet" href="/vaos-shell.css" />
</head>
<body data-app-page="index" class="cinematic-login" data-vaos-view="index">
  <header class="cinematic-chrome">
    <div class="cinematic-chrome__wordmark">
      <img src="/assets/vayu-shastr-original.webp" alt="" width="36" height="36" />
      <span>VAOS <small>Vāyū Shastr</small></span>
    </div>
  </header>

  <main class="cinematic-layout">
    <div class="cinematic-scene" id="cinematic-scene" aria-hidden="true">
      <div class="cinematic-scene__grid"></div>
      <div class="cinematic-scene__volume">
        <div class="cinematic-scene__orbit cinematic-scene__orbit--back"></div>
        <div class="cinematic-scene__art">
          <img src="/assets/vayu-shastr-cinematic.webp" width="1672" height="941" alt="" decoding="async" fetchpriority="high" />
        </div>
        <div class="cinematic-scene__orbit cinematic-scene__orbit--front"></div>
      </div>
    </div>

    <section class="access-console" aria-labelledby="signin-title">
      <h1 id="signin-title">Welcome back.</h1>
      <p class="access-console__intro">Sign in with your VYNDI account.</p>
      <form id="login-form" class="cinematic-form" method="post" action="/api/login">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" inputmode="email"
          autocapitalize="none" spellcheck="false" required />
        <label for="password">Password</label>
        <div class="password-field">
          <input id="password" name="password" type="password" autocomplete="current-password" minlength="8" required />
          <button type="button" class="text-button password-toggle" id="password-toggle" aria-controls="password" hidden>Show</button>
        </div>
        <div class="cinematic-form__row">
          <label class="remember"><input type="checkbox" id="remember" /> Remember email</label>
          <button type="button" class="text-button" id="access-help">Access help</button>
        </div>
        <button type="submit" class="cinematic-authorize" id="submit-button">
          <span id="submit-label">Sign in to workspace</span><span aria-hidden="true">→</span>
        </button>
        <p class="login-status" id="login-status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <footer class="cinematic-legal">
    <span>© 2026 Vāyū Shastr Pvt. Ltd. All Rights Reserved.</span>
  </footer>
  <script type="module" src="/app.mjs"></script>
</body>
</html>
