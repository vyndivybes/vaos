<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080909" />
  <meta name="description" content="VAOS — VYNDI Agentic Operating System by Vāyū Shastr Pvt Ltd." />
  <title>VAOS · Secure sign in</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="login-shell">
    <section class="visual-stage" aria-label="Vāyū Shastr identity">
      <div class="art-frame" data-parallax-art>
        <img src="/assets/vayu-shastr-original.webp" alt="Vāyū Shastr Pvt Ltd metallic hexagonal logo surrounded by molecular carbon structures" class="brand-art" />
        <div class="art-sheen" aria-hidden="true"></div>
      </div>
      <div class="visual-caption">
        <span>VAOS</span>
        <strong>VYNDI Agentic Operating System</strong>
        <small>Development environment · governed execution</small>
      </div>
    </section>

    <section class="auth-panel" aria-labelledby="signin-title">
      <div class="auth-kicker">VĀYŪ SHASTR PVT LTD</div>
      <h1 id="signin-title">Enter VAOS.</h1>
      <p class="auth-copy">Sign in with an authorised development identity.</p>

      <form id="login-form" class="login-form" novalidate>
        <label><span>Email</span><input id="email" name="email" type="email" autocomplete="email" required /></label>
        <label><span>Password</span><input id="password" name="password" type="password" autocomplete="current-password" minlength="8" required /></label>

        <div class="login-form__row">
          <label class="remember"><input type="checkbox" id="remember" /><span>Remember email</span></label>
          <button type="button" class="text-button" id="access-help">Access help</button>
        </div>

        <button type="submit" class="primary-button" id="submit-button">
          <span>Sign in to VAOS</span><span aria-hidden="true">→</span>
        </button>
        <p class="login-status" id="login-status" role="status" aria-live="polite"></p>
      </form>

      <footer class="auth-footer"><span>HttpOnly session</span><span>·</span><span>8-hour development access</span></footer>
    </section>
  </main>
  <script type="module" src="/app.mjs"></script>
</body>
</html>
